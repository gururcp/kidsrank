<script>
/* ============================================================================
   KidsRank — a single-file family game-night ranking board.
   No server, no build step. All data lives in localStorage under one key.
   ========================================================================== */

const KEY = 'kidsrank.v1';
const DEFAULT_PAYOUT = { first: 5, second: 3, third: 2, participation: 1 };

/* --- the shared family board (see SHARED BOARD, at the foot of this file) ---
   Deliberately null in the repository, and filled in when the page is published
   by .github/inject-config.mjs, from the FIREBASE_CONFIG repository secret. So
   the published board shares, and this file stays free of anything shaped like
   an API key. The reasoning is in that script.

   A copy opened straight off the disk therefore has no config, and is a private
   board inside one browser — which is all it could ever be, since Google
   sign-in does not work from a file:// page. To share, use the published URL.

   The line below is matched exactly, character for character, by that script.
   Changing it will fail the publish rather than quietly deploy a dead board. */
const FIREBASE_CONFIG = null;
const FAMILY_ID   = 'home';            // one board per family; this is its name
const SCHEMA      = 1;                 // bumped if the shared format ever changes
const ADOPTED_KEY = 'kidsrank.joined';
const LINK_KEY    = 'kidsrank.linkmail';  // address a sign-in link went to

const EMOJIS = ['🦊','🐧','🦁','🐯','🐨','🐼','🐵','🦄','🐙','🐢','🦉','🐝','🦖','🐬','🦋','🐰',
                '🐶','🐱','🐹','🐷','🦈','🦜','🐳','🦕','🦥','🦩','🐞','🐊','⚽','🚀','🌟','🍭',
                '🎈','🎸','🧢','🍕'];
const COLORS = ['#f43f5e','#fb923c','#facc15','#4ade80','#22d3ee','#60a5fa','#a78bfa','#f472b6','#34d399','#e879f9'];
const MEDALS = { 1: '🥇', 2: '🥈', 3: '🥉' };

/* ---------------------------------------------------------------- helpers */
const uid   = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad   = n => String(n).padStart(2, '0');
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const dstr  = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function parseDate(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function fmtDay(s) {
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (s === today()) return 'Today';
  if (s === dstr(y)) return 'Yesterday';
  return parseDate(s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtLongDay(s) {
  return parseDate(s).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtClock(sec) { sec = Math.max(0, Math.ceil(sec)); return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); }
function fmtSecs(sec) {
  if (sec == null) return '—';
  return sec >= 60 ? Math.floor(sec / 60) + 'm ' + pad(Math.round(sec % 60)) + 's' : sec.toFixed(1) + 's';
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

/* ---------------------------------------------------------------- storage */
function blankDB() {
  return {
    version: 1,
    kids: [],
    games: [],
    settings: { boardTitle: 'Family Game Board', defaultPayout: { ...DEFAULT_PAYOUT }, soundOn: true }
  };
}
function loadDB() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blankDB();
    const d = JSON.parse(raw), b = blankDB();
    return {
      version: 1,
      kids:  Array.isArray(d.kids)  ? d.kids  : [],
      games: Array.isArray(d.games) ? d.games : [],
      settings: { ...b.settings, ...(d.settings || {}),
                  defaultPayout: { ...DEFAULT_PAYOUT, ...((d.settings || {}).defaultPayout || {}) } }
    };
  } catch (e) {
    console.warn('KidsRank: could not read saved data, starting fresh.', e);
    return blankDB();
  }
}
let db = loadDB();

/* The family board, once there is one. Declared here and filled in at the foot
   of the file, so save() can reach it while everything stays in load order. */
var sync = null;
const shared = () => !!(sync && sync.on);

function writeLocal() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
    return true;
  } catch (e) {
    toast('Storage is full. Remove a photo or delete some old games.', 'bad');
    console.warn('KidsRank: save failed', e);
    return false;
  }
}

/* localStorage is written every single time, signed in or not — it is this app's
   own store and its safety net. The family board is an extra place the same data
   goes, never a replacement, so nothing here can fail because the network did. */
function save() {
  const ok = writeLocal();
  if (shared()) sync.flush();
  return ok;
}

/* ------------------------------------------------------------ kid lookups */
function kidOf(id) {
  return db.kids.find(k => k.id === id) ||
         { id: id, name: 'Removed player', emoji: '❓', color: '#64748b', photo: null, active: false };
}
const activeKids = () => db.kids.filter(k => k.active !== false);

function avatar(k, px, opts) {
  opts = opts || {};
  const inner = k.photo
    ? '<img src="' + k.photo + '" alt="' + esc(k.name) + '" class="h-full w-full object-cover">'
    : '<span style="font-size:' + Math.round(px * 0.54) + 'px;line-height:1">' + (k.emoji || '🙂') + '</span>';
  const glow = opts.glow ? 'box-shadow:0 0 0 4px ' + k.color + '55, 0 12px 34px ' + k.color + '55;' : 'box-shadow:0 6px 18px rgba(0,0,0,.35);';
  return '<span class="inline-flex shrink-0 select-none items-center justify-center overflow-hidden rounded-full bg-white/10" ' +
         'style="width:' + px + 'px;height:' + px + 'px;border:3px solid ' + k.color + ';' + glow + '">' + inner + '</span>';
}

/* ------------------------------------------------------------------ photo */
function pickPhoto(cb) {
  const inp = document.getElementById('photoInput');
  inp.value = '';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) processPhoto(f, cb); };
  inp.click();
}
// Center-crops to a square, shrinks to 320px and re-encodes as JPEG so a 4MB
// phone photo becomes ~25KB of base64 — localStorage only holds about 5MB total.
function processPhoto(file, cb) {
  if (!/^image\//.test(file.type)) { toast('That file is not a picture.', 'bad'); return; }
  const fr = new FileReader();
  fr.onerror = () => toast('Could not read that file.', 'bad');
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => toast('That picture could not be opened.', 'bad');
    img.onload = () => {
      const S = 320, cv = document.createElement('canvas');
      cv.width = cv.height = S;
      const ctx = cv.getContext('2d');
      const side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
      let out = cv.toDataURL('image/jpeg', 0.82);
      if (out.length > 90000) out = cv.toDataURL('image/jpeg', 0.6);
      cb(out);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ------------------------------------------------------------------ sound */
let audioCtx = null;
function ac() {
  if (!db.settings.soundOn) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { if (!audioCtx) audioCtx = new AC(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
  catch (e) { return null; }
}
function tone(freq, start, dur, gain, type) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle'; o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  const t = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain == null ? 0.16 : gain, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
const blip    = () => tone(880, 0, 0.12, 0.13);
const unblip  = () => tone(320, 0, 0.12, 0.10);
const dingDone= () => { tone(784, 0, 0.16); tone(1175, 0.09, 0.20); };
const tick    = () => tone(1320, 0, 0.06, 0.08, 'square');
function buzzer() { tone(180, 0, 0.5, 0.20, 'sawtooth'); tone(140, 0.14, 0.5, 0.18, 'sawtooth'); }
function fanfare() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.13, 0.5, 0.2)); }

/* --------------------------------------------------------------- fx/toast */
let toastTimer = null;
function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.className = 'pointer-events-none fixed bottom-5 left-1/2 z-[70] -translate-x-1/2 rounded-2xl px-5 py-3 ' +
    'text-center text-base font-bold shadow-2xl animate-slideup ' +
    (kind === 'bad' ? 'bg-rose-500 text-white' : 'bg-emerald-400 text-emerald-950');
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
}

function confetti(colors, ms) {
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  const W = window.innerWidth, H = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.classList.remove('hidden');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = (colors && colors.length) ? colors : COLORS;
  const P = [];
  for (let i = 0; i < 150; i++) P.push({
    x: Math.random() * W, y: -20 - Math.random() * H * 0.6,
    w: 5 + Math.random() * 8, vy: 1.8 + Math.random() * 3.2, vx: -1.2 + Math.random() * 2.4,
    a: Math.random() * Math.PI, va: -0.12 + Math.random() * 0.24, col: cols[i % cols.length]
  });
  const t0 = performance.now(), life = ms || 2800;
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.w / 2, p.w, p.w * 0.62); ctx.restore();
    });
    if (t - t0 < life) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); cv.classList.add('hidden'); }
  })(t0);
}

function animateCounts() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count) || 0, t0 = performance.now(), dur = 700;
    (function f(t) {
      const k = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(f);
    })(t0);
  });
}

/* =============================================================== SCORING ==
   One place decides places and stars, so the live screen, the saved record
   and the leaderboard can never disagree.
   Quiz : ranked by correct answers, standard competition ranking for ties
          (3/3/1 -> 1st, 1st, 3rd). A kid on zero correct never takes a place.
   Race : ranked by finish time. Anyone still going when the countdown ended
          is DNF: no place, no placement stars.
   ========================================================================= */
function computeResults(g) {
  const rows = (g.results || []).map(r => ({ ...r }));

  if (g.type === 'quiz') {
    const sorted = rows.slice().sort((a, b) => (b.correct || 0) - (a.correct || 0));
    let place = 0, prevScore = null, seen = 0;
    sorted.forEach(r => {
      seen++;
      const sc = r.correct || 0;
      if (sc !== prevScore) { place = seen; prevScore = sc; }
      r.place = sc > 0 ? place : null;
    });
  } else {
    const done = rows.filter(r => r.finishSec != null && !r.dnf).sort((a, b) => a.finishSec - b.finishSec);
    done.forEach((r, i) => { r.place = i + 1; r.dnf = false; });
    rows.filter(r => r.finishSec == null || r.dnf).forEach(r => { r.place = null; r.dnf = true; });
  }

  const p = g.payout || DEFAULT_PAYOUT;
  rows.forEach(r => {
    const base = r.place === 1 ? p.first : r.place === 2 ? p.second : r.place === 3 ? p.third : 0;
    r.stars = (Number(base) || 0) + (Number(p.participation) || 0);
  });
  return rows;
}

/* ---------------------------------------------------------- data queries */
/* Both boards must agree on WHICH game is live, otherwise each one scores into a
   different game and the evening quietly splits in two. createdAt cannot decide
   it alone — it is Date.now(), and two devices' clocks disagree — so the id
   breaks the tie. An aborted game has status 'aborted' and is in neither list. */
const liveGames = () => db.games.filter(g => g.status === 'live')
  .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
const liveGame  = () => liveGames()[0] || null;
const doneGames = () => db.games.filter(g => g.status === 'done');
const payoutOf  = g => g.payout || DEFAULT_PAYOUT;

function rangeStart(filter) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (filter === 'week')  { d.setDate(d.getDate() - 6); return dstr(d); }
  if (filter === 'month') { d.setDate(1); return dstr(d); }
  return null;
}
function filteredGames() {
  const all = doneGames();
  if (ui.filter === 'date') return all.filter(g => g.date === ui.filterDate);
  const from = rangeStart(ui.filter);
  return from ? all.filter(g => g.date >= from) : all;
}

function standings(games) {
  const m = new Map();
  const row = k => {
    if (!m.has(k.id)) m.set(k.id, { kid: k, stars: 0, played: 0, g: 0, s: 0, b: 0 });
    return m.get(k.id);
  };
  activeKids().forEach(row);
  games.forEach(g => (g.results || []).forEach(r => {
    const t = row(kidOf(r.kidId));
    t.stars += Number(r.stars) || 0;
    t.played++;
    if (r.place === 1) t.g++; else if (r.place === 2) t.s++; else if (r.place === 3) t.b++;
  }));
  const list = [...m.values()].sort((a, b) =>
    b.stars - a.stars || b.g - a.g || b.s - a.s || a.kid.name.localeCompare(b.kid.name));
  let rank = 0, prev = null;
  list.forEach((t, i) => { if (t.stars !== prev) { rank = i + 1; prev = t.stars; } t.rank = rank; });
  return list;
}

const winnersOf = g => (g.results || []).filter(r => r.place === 1).map(r => kidOf(r.kidId));

/* --------------------------------------------------------------- UI state */
const ui = {
  screen: 'board',
  filter: 'all',
  filterDate: today(),
  setup: null,
  results: null,
  celebrate: null,
  kidEdit: null,
  profile: null,
  settingsOpen: false,
  link: { mail: '', paste: '', open: false, sent: '' },
  expand: null,
  edit: null,
  undo: [],
  countUp: true
};

function go(screen) {
  ui.screen = screen;
  ui.countUp = (screen === 'board');
  window.scrollTo(0, 0);
  render();
}

function render() {
  const views = { board: viewBoard, new: viewNew, live: viewLive, results: viewResults, history: viewHistory, kids: viewKids };
  const view = views[ui.screen] || viewBoard;
  document.getElementById('app').innerHTML = shellTop() + view();
  document.getElementById('modals').innerHTML = modals();
  if (ui.countUp) { ui.countUp = false; animateCounts(); }
  syncRaceTimer();
}

/* ---------------------------------------------------------- shell / atoms */
function shellTop() {
  const tabs = [['board', '🏆', 'Board'], ['new', '🎮', 'New game'], ['history', '📅', 'History'], ['kids', '🧒', 'Kids']];
  const onLive = (ui.screen === 'live' || ui.screen === 'results');
  const live = liveGame();

  const nav = tabs.map(t => {
    const on = ui.screen === t[0];
    return '<button data-act="nav" data-id="' + t[0] + '" class="flex items-center gap-1.5 rounded-2xl px-3 py-2 text-sm font-extrabold transition sm:px-4 sm:text-base ' +
      (on ? 'bg-white text-indigo-950 shadow-lg' : 'text-white/70 hover:bg-white/10 hover:text-white') + '">' +
      '<span class="text-base sm:text-lg">' + t[1] + '</span><span class="hidden sm:inline">' + t[2] + '</span></button>';
  }).join('');

  const banner = (live && !onLive)
    ? '<button data-act="resume" class="mb-4 flex w-full items-center gap-3 rounded-2xl border-2 border-amber-300/60 bg-amber-400/15 px-4 py-3 text-left transition hover:bg-amber-400/25">' +
      '<span class="animate-shine text-2xl">🔴</span><span class="flex-1"><span class="block font-extrabold text-amber-200">Game in progress: ' + esc(live.name) + '</span>' +
      '<span class="block text-sm text-amber-100/70">Tap to jump back in</span></span><span class="text-xl">▶</span></button>'
    : '';

  return '<div class="mb-4 flex flex-wrap items-center gap-2">' +
    '<button data-act="nav" data-id="board" class="mr-auto flex items-center gap-2 text-left">' +
      '<span class="text-2xl sm:text-3xl">🏅</span>' +
      '<span class="text-lg font-extrabold leading-tight tracking-tight sm:text-2xl">' + esc(db.settings.boardTitle || 'Family Game Board') + '</span>' +
    '</button>' +
    '<div class="flex items-center gap-1 rounded-3xl bg-white/10 p-1 backdrop-blur">' + syncChip() + nav +
      '<button data-act="settings-open" title="Settings" class="rounded-2xl px-2.5 py-2 text-lg text-white/70 hover:bg-white/10 hover:text-white">⚙️</button>' +
    '</div></div>' + joinBanner() + banner;
}

/* Whether this board is on its own or joined to the family one. Silent when the
   app has no family board configured at all, so a plain copy looks untouched. */
function syncChip() {
  if (!FIREBASE_CONFIG) return '';
  const m = { connecting: ['⏳', 'Connecting…',       'text-white/60'],
              synced:     ['🔗', 'Shared board',      'text-emerald-300'],
              error:      ['⚠️', 'Not sharing',       'text-amber-300'],
              off:        ['📵', 'This device only',  'text-white/50'] }[sync ? sync.status : 'off'];
  if (!m) return '';
  const act = m[1] === 'Shared board' || m[1] === 'Connecting…' ? 'settings-open' : 'sync-in';
  return '<button data-act="' + act + '" title="' + m[1] + '" class="flex items-center gap-1.5 rounded-2xl px-2.5 py-2 text-xs font-extrabold ' +

/* Signing in by email link, for an address that is not a Google Account.

/* An outstanding link, remembered in storage rather than only in memory. On an

   link, and may well be reloaded on the way back; asking storage means the
   paste box is still waiting when she returns. */
function linkPending() {

function emailLinkForm() {

      'and then stays signed in. The link is good for one use.</p>' +
      /* The iPhone case, and it is not a rare one: an app added to the home
         screen is a separate browser as far as signing in goes, and a link
         tapped in Mail always opens in Safari instead — so the sign-in lands
         next door and the home-screen app is never signed in at all. Pasting
         the link takes it to the right place. Firebase reads the code out of
         whatever link it is handed, so this is the same sign-in by another road. */
      '<div class="mt-3 rounded-2xl bg-black/25 p-3">' +
        '<div class="font-extrabold text-white/80">Does the link open somewhere else?</div>' +
        '<p class="mt-1 text-xs text-white/55">If this board was added to the home screen, a link tapped in Mail opens in ' +
          'Safari, which counts as a different browser and signs <i>that</i> in instead. So don\'t tap it: in Mail, ' +

/* ============================================================ LIVE — QUIZ */
function viewQuiz(g) {
  const rows = g.results || [];
  /* An atomic increment has no floor, so two people both tapping − on a kid who
     is on zero can briefly land on −1. Clamped on the way out here; computeResults
     and saveResults clamp again, so a negative never reaches the board. */
  const scoreOf = r => Math.max(0, r.correct || 0);
  const best = Math.max(0, ...rows.map(scoreOf));
  const total = rows.reduce((a, r) => a + scoreOf(r), 0);
  const timed = hasClock(g), perQ = perQuestion(g);
  const over = timed && raceOver(g);
  const frozen = over && !perQ;          // the round's clock ran out — no more points

  const clock = !timed ? '' : clockCard(g,
    perQ
      ? (over
          ? btn('next-q', '➡ Next question', { tone: 'hero', cls: 'text-lg' })
          : (g.raceStart
              ? btn('race-pause', '⏸ Pause', {})
              : btn('race-start', (g.raceAccum ? '▶ Resume' : '▶ Start question ' + (g.qNo || 1)), { tone: 'hero', cls: 'text-lg' })))
      : (over
          ? btn('finish-quiz', '🏁 See results', { tone: 'primary', cls: 'text-lg' })
          : (g.raceStart
              ? btn('race-pause', '⏸ Pause', {})
              : btn('race-start', (g.raceAccum ? '▶ Resume' : '▶ Start the clock'), { tone: 'hero', cls: 'text-lg' }))));

  const cards = rows.map(r => {
    const k = kidOf(r.kidId), n = scoreOf(r), lead = n > 0 && n === best;
    return '<div data-act="plus" data-id="' + r.kidId + '" role="button" tabindex="0" ' +
      'class="noselect relative flex cursor-pointer flex-col justify-center rounded-3xl border-4 p-4 text-center shadow-xl transition active:scale-[0.97] ' +
      (timed ? 'lg:min-h-[30vh] ' : 'lg:min-h-[52vh] ') + (frozen ? 'opacity-60 ' : '') +

    : perQ ? 'Press Start, then read the question out. Space bar works too.'

/* ============================================================ LIVE — RACE */
/* One clock serves both game types: the race countdown and the quiz's optional
   round / per-question timer. Times are wall-clock so a backgrounded tab, a
   pause, or a refresh mid-game never drifts. */
const raceElapsed = g => ((g.raceAccum || 0) + (g.raceStart ? Date.now() - g.raceStart : 0)) / 1000;
/* Pausing folds the running span into raceAccum. Since the clock no longer
   stops itself at zero, that span can overrun the countdown, so it is capped. */
function foldedAccum(g) {
  let acc = (g.raceAccum || 0) + (g.raceStart ? Date.now() - g.raceStart : 0);
  if (g.countdownSec) acc = Math.min(acc, g.countdownSec * 1000);
  return acc;
}
function foldClock(g) { g.raceAccum = foldedAccum(g); g.raceStart = null; }
const raceRemain  = g => (g.countdownSec || 0) - raceElapsed(g);
const raceOver    = g => raceRemain(g) <= 0;
const perQuestion = g => !!g && g.type === 'quiz' && g.quizTimer === 'question';
const hasClock    = g => !!g && (g.type === 'race' || (g.type === 'quiz' && !!g.quizTimer && g.quizTimer !== 'off'));
const clockColor  = (rem, perQ) => rem <= (perQ ? 3 : 10) ? '#fb7185' : rem <= (perQ ? 5 : 30) ? '#fbbf24' : '#ffffff';
const clockText   = (rem, perQ) => perQ ? String(Math.max(0, Math.ceil(rem))) : fmtClock(Math.max(0, rem));

let raceTicker = null, lastTickSec = null, buzzedFor = null;
function syncRaceTimer() {
  const g = liveGame();
  const needs = ui.screen === 'live' && g && hasClock(g) && g.raceStart && !raceOver(g);
  if (needs && !raceTicker) raceTicker = setInterval(raceTick, 200);
  if (!needs && raceTicker) { clearInterval(raceTicker); raceTicker = null; lastTickSec = null; }
}
/* The clock saves nothing. "Time is up" is derived from raceStart + countdownSec,
   so every device works it out independently and none of them race to write the
   same mutation. It also fixes a bug that was already here: this only ran while
   somebody had the live screen open, so a clock that expired on the board screen
   never recorded the expiry at all. computeResults() already re-derives DNF from
   a missing finishSec, so the cached r.dnf it used to set was redundant. The one
   thing that genuinely cannot be derived is the tally of unanswered questions,
   so that moved to the 'next-q' action, which one person deliberately taps. */
function raceTick() {
  const g = liveGame();
  const el = document.getElementById('raceClock');
  if (!g || !hasClock(g) || !el) { syncRaceTimer(); return; }
  const rem = raceRemain(g), perQ = perQuestion(g);
  el.textContent = clockText(rem, perQ);
  el.style.color = clockColor(rem, perQ);
  const whole = Math.ceil(rem);
  if (whole !== lastTickSec) {
    lastTickSec = whole;
    if (whole > 0 && whole <= (perQ ? 3 : 5)) tick();
  }
  if (rem <= 0) {
    const run = g.id + ':' + (g.qNo || 1) + ':' + (g.raceStart || 0);
    if (buzzedFor !== run) { buzzedFor = run; buzzer(); }
    render();                      // -> syncRaceTimer() stops the ticker
  }
}

function clockCard(g, buttons) {
  const perQ = perQuestion(g), rem = raceRemain(g), over = rem <= 0, running = !!g.raceStart;
  const label = over
    ? (perQ ? 'Buzz! Nobody got it' : 'Time is up')
    : running
      ? (perQ ? 'Question ' + (g.qNo || 1) : 'Time remaining')
      : (perQ ? 'Question ' + (g.qNo || 1) + ' — ready' : (g.raceAccum ? 'Paused' : 'Ready'));
  return card(
    '<div class="text-center">' +
      '<div class="text-xs font-extrabold uppercase tracking-[0.2em] text-white/40">' + label + '</div>' +
      '<div id="raceClock" class="my-1 font-extrabold leading-none tabnum ' +
        (perQ ? 'text-8xl sm:text-9xl' : 'text-7xl sm:text-8xl') + (over ? ' animate-shake' : '') + '" ' +
        'style="color:' + clockColor(Math.max(0, rem), perQ) + '">' + clockText(rem, perQ) + '</div>' +
      '<div class="mt-3 flex flex-wrap justify-center gap-2">' + buttons + '</div>' +
    '</div>', 'mb-4' + (over ? ' border-rose-400/50' : ''));
}

function viewRace(g) {
  const rows = g.results || [];
  const rem = raceRemain(g);
  const over = rem <= 0;
  const running = !!g.raceStart;
  const nextPlace = rows.filter(r => r.finishSec != null).length + 1;

  const clock = clockCard(g,
    over ? btn('finish-race', '🏁 See results', { tone: 'primary', cls: 'text-lg' })
         : (running ? btn('race-pause', '⏸ Pause', {}) : btn('race-start', (g.raceAccum ? '▶ Resume' : '▶ Start timer'), { tone: 'hero', cls: 'text-lg' })) +
           btn('finish-race', '🏁 Finish now', { tone: 'primary' }));

  const cards = rows.map(r => {
    const k = kidOf(r.kidId), done = r.finishSec != null;
    const place = done ? rows.filter(x => x.finishSec != null && x.finishSec < r.finishSec).length + 1 : null;
    const body = done
      ? '<div class="text-4xl">' + (MEDALS[place] || place + 'th') + '</div>' +
        '<div class="text-3xl font-extrabold tabnum" style="color:' + k.color + '">' + fmtSecs(r.finishSec) + '</div>' +
        '<button data-act="unfinish" data-id="' + r.kidId + '" class="mt-2 rounded-2xl bg-white/10 px-3 py-2 text-sm font-bold text-white/60 hover:bg-white/20">↩ still going</button>'
      : (r.dnf || over
        ? '<div class="text-3xl">😴</div><div class="text-xl font-extrabold text-white/50">Ran out of time</div>'
        : '<div class="mt-1 text-sm font-bold uppercase tracking-wider text-white/40">racing…</div>' +
          '<button data-act="done" data-id="' + r.kidId + '" class="mt-2 w-full rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-500 py-4 text-2xl font-extrabold text-emerald-950 shadow-lg transition active:scale-95 hover:brightness-110">Done!</button>');
    return '<div class="flex flex-col justify-center rounded-3xl border-4 p-4 text-center shadow-xl lg:min-h-[34vh] ' + (done ? 'bg-white/[0.14]' : 'bg-white/[0.06]') + '" ' +
      'style="border-color:' + (done ? k.color : 'rgba(255,255,255,.12)') + ';' + (done ? 'box-shadow:0 0 30px ' + k.color + '44;' : '') + '">' +
      '<div class="flex justify-center">' + avatar(k, 88, { glow: done }) + '</div>' +
      '<div class="mt-2 truncate text-xl font-extrabold">' + esc(k.name) + '</div>' + body + '</div>';
  }).join('');

  const hint = over ? 'Timer finished — anyone who did not tap Done gets no placement stars.'
    : running ? 'Next to finish takes place ' + nextPlace + '.'
    : 'Press Start when they begin.';

  return liveHeader(g, btn('abort-game', '✖ Abort', { tone: 'danger', cls: 'text-sm' })) + clock +
    '<div class="grid gap-4 ' + gridCols(rows.length) + '">' + cards + '</div>' +
    '<p class="mt-4 text-center text-sm text-white/40">' + hint + '</p>';
}

function viewResults() {

  const lines = order.map(o => {
    const k = kidOf(o.row.kidId), pl = o.row.place;
    const detail = g.type === 'quiz'
      ? plural(o.row.correct || 0, 'correct answer')
      : (o.row.dnf ? 'Did not finish in time' : 'Finished in ' + fmtSecs(o.row.finishSec));
    return '<div class="flex items-center gap-3 rounded-2xl border-2 p-3 ' + (pl === 1 ? 'border-amber-300/60 bg-amber-300/10' : 'border-white/10 bg-white/5') + '">' +
      '<span class="w-9 shrink-0 text-center text-2xl">' + (MEDALS[pl] || (pl ? pl + 'th' : '·')) + '</span>' +
      avatar(k, 52) +
      '<span class="min-w-0 flex-1"><span class="block truncate text-lg font-extrabold">' + esc(k.name) + '</span>' +
        '<span class="block text-sm text-white/50">' + detail + '</span></span>' +
      '<label class="flex shrink-0 items-center gap-1 rounded-2xl bg-amber-400/15 px-3 py-2">' +
        '<input type="number" min="0" max="99" value="' + (o.row.stars || 0) + '" data-bind="results.rows.' + o.i + '.stars" ' +
          'class="w-14 bg-transparent text-center text-2xl font-extrabold text-amber-300 outline-none tabnum">' +
        '<span class="text-xl">⭐</span></label>' +
    '</div>';
  }).join('');

  const champs = r.rows.filter(x => x.place === 1).map(x => esc(kidOf(x.kidId).name)).join(' & ');

  return card(
    '<div class="mb-3 text-center"><div class="text-4xl">🏁</div>' +
      '<div class="text-2xl font-extrabold">' + esc(g.name) + '</div>' +
      '<div class="text-white/50">' + fmtLongDay(g.date) + '</div>' +
      (champs ? '<div class="mt-2 text-lg font-extrabold text-amber-300">Winner: ' + champs + '</div>'
              : '<div class="mt-2 text-lg font-extrabold text-white/60">No winner this round</div>') + '</div>' +
    (r.changed ? '<div class="mb-3 rounded-2xl border-2 border-amber-300/60 bg-amber-400/15 p-3 text-center text-sm font-bold text-amber-100">' +
      '⚠️ The score changed on the other board while this screen was open. These numbers are the up-to-date ones — tap again to award them.</div>' : '') +
    '<div class="space-y-2">' + lines + '</div>' +
    '<p class="mt-3 text-center text-sm text-white/40">Stars are worked out from the places — nudge any number if you want to.</p>' +
    '<div class="mt-5 flex flex-wrap justify-center gap-2">' +
      btn('results-save', '⭐ Award the stars', { tone: 'primary', cls: 'text-xl px-8 py-4' }) +
      btn('results-back', '← Back to the game', {}) +
      btn('abort-game', '✖ Abort — no stars', { tone: 'danger' }) +
    '</div>'
  );
}

function viewHistory() {
  const games = doneGames().slice().sort((a, b) => (b.date < a.date ? -1 : b.date > a.date ? 1 : (b.finishedAt || 0) - (a.finishedAt || 0)));
  if (!games.length) {
    return emptyState('📅', 'No games recorded yet', 'Every game you finish gets filed here under the day you played it.',
      btn('nav', '🎮 Start a game', { tone: 'hero', id: 'new' }));
  }
  const byDate = new Map();
  games.forEach(g => { if (!byDate.has(g.date)) byDate.set(g.date, []); byDate.get(g.date).push(g); });

  return [...byDate.entries()].map(([date, list]) => {
    const dayStars = list.reduce((a, g) => a + (g.results || []).reduce((x, r) => x + (r.stars || 0), 0), 0);
    const cards = list.map(g => {
      const champs = winnersOf(g);
      const open = ui.expand === g.id;
      const chips = (g.results || []).slice().sort((a, b) => (a.place || 99) - (b.place || 99)).map(r => {
        const k = kidOf(r.kidId);
        return '<span class="flex items-center gap-1.5 rounded-full bg-white/10 py-1 pl-1 pr-2.5">' + avatar(k, 26) +
          '<span class="text-sm font-extrabold">' + (MEDALS[r.place] || '') + ' ' + (r.stars || 0) + '⭐</span></span>';
      }).join('');
      return '<div class="rounded-3xl border border-white/10 bg-white/[0.06] p-3">' +
        '<button data-act="game-expand" data-id="' + g.id + '" class="flex w-full items-center gap-3 text-left">' +
          '<span class="text-2xl">' + (g.type === 'quiz' ? '🔔' : '⏱️') + '</span>' +
          '<span class="min-w-0 flex-1"><span class="block truncate text-lg font-extrabold leading-tight">' + esc(g.name) + '</span>' +
            '<span class="block truncate text-sm text-white/50">' + (champs.length ? '🏆 ' + champs.map(k => esc(k.name)).join(' & ') : 'No winner') + '</span></span>' +
          '<span class="text-white/40">' + (open ? '▲' : '▼') + '</span></button>' +
        '<div class="mt-2 flex flex-wrap gap-1.5">' + chips + '</div>' +
        (open ? gameEditor(g) : '') + '</div>';
    }).join('');
    return '<div class="mb-5">' +
      '<div class="mb-2 flex items-center gap-2"><h2 class="text-lg font-extrabold">' + fmtDay(date) + '</h2>' +
        '<span class="text-sm text-white/40">' + fmtLongDay(date) + '</span>' +
        '<span class="ml-auto">' + starPill(dayStars) + '</span></div>' +
      '<div class="space-y-2">' + cards + '</div></div>';
  }).join('');
}

function starPill(n) {
  return '<span class="inline-flex items-center gap-1 rounded-full bg-amber-400/20 px-2.5 py-1 text-sm font-extrabold text-amber-200">⭐ ' + n + '</span>';
}

  const active = activeKids();
  const gone = db.kids.filter(k => k.active === false);

  return (ui.kidEdit ? kidEditor() : '<div class="mb-4">' + btn('kid-new', '➕ Add a player', { tone: 'primary', cls: 'text-lg' }) + '</div>') +
    (active.length ? card('<div class="space-y-2">' + listOf(active, false) + '</div>')
                   : (ui.kidEdit ? '' : emptyState('🧒', 'No players yet', 'Add each kid with a photo or an animal and their own colour.',
                        btn('kid-new', '➕ Add a player', { tone: 'primary' })))) +
    (gone.length ? '<div class="mt-4">' + fieldLabel('Not playing at the moment') + card('<div class="space-y-2">' + listOf(gone, true) + '</div>') + '</div>' : '');
}

/* ============================================================== BINDINGS */
const bindRoots = () => ({ setup: ui.setup, results: ui.results, edit: ui.edit, kidEdit: ui.kidEdit, settings: db.settings, link: ui.link });
function setPath(path, value) {
  const parts = path.split('.');
  let obj = bindRoots()[parts[0]];
  if (!obj) return;
  for (let i = 1; i < parts.length - 1; i++) { obj = obj[parts[i]]; if (!obj) return; }
  obj[parts[parts.length - 1]] = value;
}
document.addEventListener('input', e => {
  const el = e.target.closest('[data-bind]');
  if (!el) return;
  const v = el.type === 'number' ? (el.value === '' ? 0 : clamp(Math.round(Number(el.value)) || 0, 0, 999)) : el.value;
  setPath(el.dataset.bind, v);
  if (el.dataset.bind.indexOf('settings.') === 0) save();
});

/* =============================================================== ACTIONS */
function startGame() {
  const s = ui.setup;
  if (liveGame()) { toast('Finish the game already running first.', 'bad'); return; }
  const who = s.participants.filter(id => db.kids.some(k => k.id === id));
  if (!who.length) { toast('Pick at least one player.', 'bad'); return; }
  const n = v => Math.max(0, Math.round(Number(v)) || 0);
  const g = {
    id: uid(),
    date: s.date || today(),
    name: (s.name || '').trim() || (s.type === 'quiz' ? 'Quiz night' : 'Timed race'),
    type: s.type,
    payout: { first: n(s.payout.first), second: n(s.payout.second), third: n(s.payout.third), participation: n(s.payout.participation) },
    quizTimer: s.type === 'quiz' ? (s.timer || 'off') : null,
    countdownSec: s.type === 'race' || s.timer === 'game' ? Math.max(10, n(s.minutes || 10) * 60)
      : s.type === 'quiz' && s.timer === 'question' ? clamp(n(s.qSecs || 15), 3, 300)
      : null,
    status: 'live', raceStart: null, raceAccum: 0, qNo: 1, passed: 0,
    results: who.map(id => ({ kidId: id, correct: 0, finishSec: null, dnf: false, place: null, stars: 0 })),
    createdAt: Date.now(), finishedAt: null
  };
  db.games.push(g);
  save();
  // the game must exist on the family board before any tap can score into it
  if (shared()) sync.pushNow();
  ui.undo = []; ui.setup = null; go('live');
}

function bumpScore(kidId, delta) {
  const g = liveGame(); if (!g || g.type !== 'quiz') return;
  if (delta > 0 && hasClock(g) && !perQuestion(g) && raceOver(g)) {
    toast('Time is up — no more points.', 'bad'); return;
  }
  const r = (g.results || []).find(x => x.kidId === kidId); if (!r) return;
  if (delta < 0 && (r.correct || 0) <= 0) return;          // nothing to take away
  ui.undo.push({ kidId: kidId, delta: delta });
  if (ui.undo.length > 40) ui.undo.shift();
  delta > 0 ? blip() : unblip();
  // a correct answer ends the question: stop the clock, ready the next one
  const nextQ = delta > 0 && perQuestion(g)
    ? [['raceStart', null], ['raceAccum', 0], ['qNo', (g.qNo || 1) + 1]] : null;

  if (shared()) {
    /* Firestore only, and nothing touched locally. The listener hands this
       device its own write straight back, so the number still moves at once —
       but adding delta here as well would count every tap twice. increment() is
       what lets two people tap at the same instant and have both land. */
    sync.bump(g.id, kidId, delta, nextQ);
    return;
  }
  r.correct = Math.max(0, (r.correct || 0) + delta);
  if (nextQ) { g.raceStart = null; g.raceAccum = 0; g.qNo = (g.qNo || 1) + 1; }
  save(); render();
}

/* The confirm screen holds a snapshot of the score taken when Finish was pressed.
   If the other board keeps scoring after that, saving the snapshot would silently
   throw those taps away — so the snapshot is fingerprinted and re-checked. */
function scoreSig(g) {
  // dnf is left out on purpose: computeResults derives it from a missing
  // finishSec, which is already in here, so including it only adds false alarms
  return (g.results || []).map(r =>
    r.kidId + ':' + (r.correct || 0) + ':' + (r.finishSec == null ? '-' : r.finishSec)
  ).join('|');
}
function openResults(g) {
  ui.results = { gameId: g.id, rows: computeResults(g), sig: scoreSig(g) };
  go('results');
}

function saveResults() {
  const g = db.games.find(x => x.id === (ui.results || {}).gameId);
  if (!g) { go('board'); return; }
  if (ui.results.sig != null && scoreSig(g) !== ui.results.sig) {
    // re-derive from the score as it stands now and make them look again
    ui.results = { gameId: g.id, rows: computeResults(g), sig: scoreSig(g), changed: true };
    render();
    toast('The score changed on the other board — check these numbers.', 'bad');
    return;
  }
  g.results = ui.results.rows.map(r => ({
    kidId: r.kidId,
    correct: Math.max(0, Number(r.correct) || 0),
    finishSec: r.finishSec == null ? null : Number(r.finishSec),
    dnf: !!r.dnf,
    place: r.place || null,
    stars: Math.max(0, Math.round(Number(r.stars)) || 0)
  }));
  g.status = 'done';
  g.finishedAt = Date.now();
  g.raceStart = null;
  save();
  if (shared()) {
    /* The frozen result goes up straight away rather than on the debounce, and
       then the live tallies come off: a late tap from the other board must not
       leave the game contradicting the stars it just awarded. */
    sync.pushNow();
    sync.finalize(g.id);
  }
  ui.results = null;
  ui.celebrate = g.id;
  ui.screen = 'board';
  ui.countUp = true;
  render();
  const champs = winnersOf(g);
  confetti(champs.length ? champs.map(k => k.color).concat(['#fde047', '#ffffff']) : COLORS);
  fanfare();
}

const actions = {
  nav: (el, id) => {
    ui.celebrate = null; ui.profile = null; ui.settingsOpen = false;
    if (id === 'new') ui.setup = defaultSetup();
    go(id);
  },
  resume: () => go('live'),
  filter: (el, id) => { ui.filter = id; ui.countUp = true; render(); },

  /* --- new game --- */
  'setup-name': (el, id) => { ui.setup.name = id; render(); },
  'setup-type': (el, id) => { ui.setup.type = id; render(); },
  'setup-mins': (el, id) => { ui.setup.minutes = Number(id); render(); },
  'setup-timer': (el, id) => { ui.setup.timer = id; render(); },
  'setup-secs': (el, id) => { ui.setup.qSecs = Number(id); render(); },
  'setup-who': (el, id) => {
    const p = ui.setup.participants, i = p.indexOf(id);
    i >= 0 ? p.splice(i, 1) : p.push(id);
    render();
  },
  'start-game': startGame,

  /* --- live quiz --- */
  plus:  (el, id) => bumpScore(id, +1),
  minus: (el, id) => bumpScore(id, -1),
  undo: () => {
    // your own taps only — the undo stack is per device, never shared
    const last = ui.undo.pop(); if (!last) return;
    const g = liveGame(); if (!g) return;
    const r = (g.results || []).find(x => x.kidId === last.kidId); if (!r) return;
    unblip();
    if (shared()) { sync.bump(g.id, last.kidId, -last.delta, null); return; }
    r.correct = Math.max(0, (r.correct || 0) - last.delta);
    save(); render();
  },
  'finish-quiz': () => { const g = liveGame(); if (g) openResults(g); },

  /* --- the clock (race countdown, and the quiz's optional timer) --- */
  'race-start': () => {
    const g = liveGame(); if (!g || !hasClock(g) || raceOver(g)) return;
    dingDone();
    if (shared()) { sync.clock(g.id, [['raceStart', Date.now()]], g.clockSeq); return; }
    g.raceStart = Date.now(); save(); render();
  },
  'next-q': () => {
    const g = liveGame(); if (!perQuestion(g)) return;
    /* Getting here means the clock ran out with nobody answering — a correct
       answer moves the question on through bumpScore instead. This tally is the
       only part of expiry that cannot be derived, so it lives on the deliberate
       tap of one person rather than in the clock tick of every device. */
    const over = raceOver(g);
    dingDone();
    if (shared()) {
      // keyed by question number, so both boards tapping this is one pass, not two
      if (over) sync.markPassed(g.id, g.qNo || 1);
      sync.clock(g.id, [['raceStart', Date.now()], ['raceAccum', 0], ['qNo', (g.qNo || 1) + 1]], g.clockSeq);
      return;
    }
    if (over) g.passed = (g.passed || 0) + 1;
    g.raceAccum = 0; g.raceStart = Date.now(); g.qNo = (g.qNo || 1) + 1;
    save(); render();
  },
  'race-pause': () => {
    const g = liveGame(); if (!g || !g.raceStart || raceOver(g)) return;
    if (shared()) { sync.clock(g.id, [['raceStart', null], ['raceAccum', foldedAccum(g)]], g.clockSeq); return; }
    foldClock(g); save(); render();
  },
  done: (el, id) => {
    const g = liveGame(); if (!g) return;
    if (!g.raceStart && !g.raceAccum) { toast('Start the timer first.', 'bad'); return; }
    // the clock no longer stops itself, so this is what keeps a late tap out
    if (raceOver(g)) { toast('Time is up — no more finishers.', 'bad'); return; }
    const r = (g.results || []).find(x => x.kidId === id); if (!r || r.finishSec != null) return;
    const sec = Math.max(0.1, Math.round(raceElapsed(g) * 10) / 10);
    dingDone();
    /* If both boards tap Done for the same child, the later write wins. The two
       readings are a moment apart, and as soon as one lands the other board's
       button disappears, so the honest answer and the winning one agree. */
    if (shared()) { sync.setFinish(g.id, id, sec); return; }
    r.finishSec = sec; r.dnf = false;
    save(); render();
  },
  unfinish: (el, id) => {
    const g = liveGame(); if (!g) return;
    const r = (g.results || []).find(x => x.kidId === id); if (!r) return;
    if (shared()) { sync.clearFinish(g.id, id); return; }
    r.finishSec = null; r.dnf = raceOver(g);
    save(); render();
  },
  'finish-race': () => {
    const g = liveGame(); if (!g) return;
    const left = (g.results || []).filter(r => r.finishSec == null && !r.dnf);
    if (left.length && !raceOver(g) &&
        !confirm(left.map(r => kidOf(r.kidId).name).join(', ') + ' have not finished. They will get no placement stars. Finish the game now?')) return;
    if (shared()) {
      // computeResults derives DNF from a missing finishSec, so only the clock
      // needs sending — and marking dnf locally would just be undone by the
      // next snapshot, making the results screen think the score had changed.
      sync.clock(g.id, [['raceStart', null], ['raceAccum', foldedAccum(g)]], g.clockSeq);
      foldClock(g);
    } else {
      foldClock(g);
      left.forEach(r => { r.dnf = true; });
      save();
    }
    openResults(g);
  },

  /* --- abort: throw the running game away, nobody scores --- */
  'abort-game': () => {
    const g = liveGame();
    if (!g) { ui.results = null; go('board'); return; }
    if (!confirm('Abort "' + g.name + '"? It is not saved and nobody gets any stars.')) return;
    /* Tombstone rather than remove. If the other board is offline mid-scoring, a
       delete lets its queued taps recreate the game as a fragment with no payout
       and no status — a zombie that either hides forever or crashes the render.
       An 'aborted' game is in neither liveGames() nor doneGames(), so it is just
       as invisible, and a late tap lands somewhere harmless. */
    g.status = 'aborted';
    g.finishedAt = Date.now();
    foldClock(g);
    save();
    if (shared()) { sync.pushNow(); sync.finalize(g.id); }
    ui.results = null;
    ui.undo = [];
    unblip();
    go('board');                 // render() -> syncRaceTimer() stops the clock
    toast('Game aborted. No stars awarded.');
  },

  /* --- results --- */
  'results-save': saveResults,
  'results-back': () => { ui.results = null; go('live'); },
  'celebrate-close': () => { ui.celebrate = null; ui.countUp = true; go('board'); },

  /* --- history --- */
  'game-expand': (el, id) => {
    if (ui.expand === id) { ui.expand = null; ui.edit = null; render(); return; }
    const g = db.games.find(x => x.id === id); if (!g) return;
    ui.expand = id;
    ui.edit = { id: id, name: g.name, date: g.date, stars: {} };
    (g.results || []).forEach(r => { ui.edit.stars[r.kidId] = r.stars || 0; });
    render();
  },
  'game-collapse': () => { ui.expand = null; ui.edit = null; render(); },
  'game-save': (el, id) => {
    const g = db.games.find(x => x.id === id); if (!g || !ui.edit) return;
    g.name = (ui.edit.name || '').trim() || g.name;
    g.date = ui.edit.date || g.date;
    (g.results || []).forEach(r => { r.stars = Math.max(0, Math.round(Number(ui.edit.stars[r.kidId])) || 0); });
    save(); ui.expand = null; ui.edit = null; render(); toast('Game updated.');
  },
  'game-delete': (el, id) => {
    const g = db.games.find(x => x.id === id); if (!g) return;
    if (!confirm('Delete "' + g.name + '" from ' + fmtDay(g.date) + '? The stars from it will be taken off the board.')) return;
    g.status = 'deleted';           // tombstone, for the same reason as abort
    save(); ui.expand = null; ui.edit = null; render(); toast('Game deleted.');
  }
};

/* --- kids, modals, settings --- */
Object.assign(actions, {
  'kid-new': () => {

  },
  'kid-edit': (el, id) => {

    go('kids');
  },
  'kid-cancel': () => { ui.kidEdit = null; render(); },
  'kid-emoji': (el, id) => { ui.kidEdit.emoji = id; render(); },
  'kid-color': (el, id) => { ui.kidEdit.color = decodeURIComponent(id); render(); },
  'kid-photo': () => pickPhoto(dataUrl => { ui.kidEdit.photo = dataUrl; render(); toast('Photo added.'); }),
  'kid-photo-clear': () => { ui.kidEdit.photo = null; render(); },
  'kid-save': () => {
    const e = ui.kidEdit, name = (e.name || '').trim();
    if (!name) { toast('Give this player a name first.', 'bad'); return; }
    if (e.id) {
      const k = db.kids.find(x => x.id === e.id);
      // the other board may have taken this player off while the form was open
      if (!k) { ui.kidEdit = null; render(); toast('That player is no longer on the board.', 'bad'); return; }
      Object.assign(k, { name: name, emoji: e.emoji, color: e.color, photo: e.photo });
    } else {
      db.kids.push({ id: uid(), name: name, emoji: e.emoji, color: e.color, photo: e.photo, active: true, createdAt: Date.now() });
    }
    if (save()) { ui.kidEdit = null; render(); toast(name + ' is ready to play.'); }
  },
  'kid-archive': (el, id) => {
    const k = db.kids.find(x => x.id === id); if (!k) return;
    k.active = false; save(); render();
    toast(k.name + ' is out of the line-up. Their history is kept.');
  },
  'kid-restore': (el, id) => {
    const k = db.kids.find(x => x.id === id); if (!k) return;
    k.active = true; save(); render(); toast(k.name + ' is back in.');
  },

  profile: (el, id) => { ui.profile = id; render(); },
  'modal-close': () => { ui.profile = null; render(); },
  'settings-open': () => { ui.settingsOpen = true; render(); },
  'sync-in': () => { ui.joinHide = true; if (sync) sync.signIn(); },
  'sync-out': () => {
    if (!confirm('Sign out of the family board? This device keeps everything it has now, but it stops matching the others.')) return;
    ui.settingsOpen = false;
    sync.signOut();
    toast('Signed out. This board is on its own again.');
  },
  'join-hide': () => { ui.joinHide = true; render(); },
  'link-open':  () => { ui.link.open = true; render(); },
  'link-reset': () => {
    // the outstanding link is abandoned, so it stops being remembered too
    try { localStorage.removeItem(LINK_KEY); } catch (e) {}
    ui.link = { mail: '', paste: '', open: true, sent: '' };
    render();
  },
  'link-send':  () => { if (sync) sync.emailLinkSend(ui.link.mail); },
  'link-paste-go': () => { if (sync) sync.emailLinkPaste(ui.link.paste); },
  'settings-save': () => { save(); ui.settingsOpen = false; render(); },
  'sound-toggle': () => { db.settings.soundOn = !db.settings.soundOn; save(); render(); if (db.settings.soundOn) dingDone(); },
  wipe: () => {
    if (!confirm('Erase every player, game and star? This cannot be undone.')) return;
    // on a shared board, "erase everything" has to say whose everything
    const family = shared() && confirm(
      'This board is shared.\n\nOK — erase the FAMILY board, for everybody, on every device.\n\n' +
      'Cancel — erase only this device and leave the family board alone. This device signs out of it.');
    if (!confirm('Really erase everything? Last chance.')) return;
    if (shared()) {
      if (family) { db.kids = []; db.games = []; sync.pushNow(); }
      // signing out detaches the listeners first, so clearing db below stays
      // this device's business and does not take her board down with it
      else sync.signOut();
    }
    try { localStorage.removeItem(KEY); localStorage.removeItem(ADOPTED_KEY); } catch (e) {}
    db = blankDB();
    Object.assign(ui, { screen: 'board', filter: 'all', filterDate: today(), setup: null, results: null,
                        celebrate: null, kidEdit: null, profile: null, settingsOpen: false, expand: null, edit: null, undo: [],
                        link: { mail: '', paste: '', open: false, sent: '' } });
    render(); toast('Board cleared.');
  }
});

/* =============================================================== EVENTS */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.backdrop && e.target !== el) return;   // ignore clicks inside a modal
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, el.dataset.id, e); }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act="filter-date"]');
  if (!el) return;
  ui.filterDate = el.value || today();
  ui.filter = 'date';
  ui.countUp = true;
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (ui.celebrate) return actions['celebrate-close']();
    if (ui.profile) return actions['modal-close']();
    if (ui.settingsOpen) return actions['settings-save']();
  }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) return;

  // Enter / Space activate a focused card
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.act) {
    e.preventDefault(); actions[e.target.dataset.act](e.target, e.target.dataset.id, e); return;
  }
  // Live quiz keyboard shortcuts: 1..9 score a player, Z undoes
  const g = liveGame();
  if (ui.screen === 'live' && g && g.type === 'quiz') {
    if (/^[1-9]$/.test(e.key)) {
      const r = (g.results || [])[Number(e.key) - 1];
      if (r) { e.preventDefault(); bumpScore(r.kidId, +1); }
    } else if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); actions.undo(); }
    else if (e.key === ' ' && hasClock(g)) {
      e.preventDefault();
      actions[perQuestion(g) && raceOver(g) ? 'next-q' : g.raceStart ? 'race-pause' : 'race-start']();
    }
  }
});

window.addEventListener('beforeunload', () => { if (liveGame()) save(); if (shared()) sync.pushNow(); });


/* ======================================================= SHARED BOARD ==
   Two households, one board. Firestore holds the family's players, games and
   stars; Google sign-in decides who may read them, because this page is
   published publicly and the children's names and photos are in there.

   Three rules shape everything below.

   1. localStorage is written unconditionally, signed in or not. If any of this
      ever misbehaves, the board is still sitting there in the browser.
   2. db keeps the shape it has always had, a game holding a results[] array.
      Only the wire format differs: a live game travels as a roster plus
      per-player maps, so two people tapping at once both land. docToGame folds
      those maps straight back into results[], so no view code changed.
   3. While shared, the live score is changed ONLY in Firestore. The listener
      hands back your own write immediately, so it still feels instant — and
      changing db as well would apply every tap twice.
   ======================================================================== */

/* ------------------------------------------------------------ wire format */
function kidToDoc(k) {
  return { name: k.name || '', emoji: k.emoji || '🙂', color: k.color || COLORS[0],
           photo: k.photo || null, active: k.active !== false,
           createdAt: k.createdAt || Date.now() };
}
function docToKid(id, d) {
  return { id: id, name: d.name || '', emoji: d.emoji || '🙂', color: d.color || COLORS[0],
           photo: d.photo || null, active: d.active !== false, createdAt: d.createdAt || 0 };
}

/* A live game's score and clock are deliberately absent from this. They belong
   to the targeted operations further down, so this whole-document push and
   those operations can never overwrite one another's work. */
function gameToDoc(g) {
  const d = {
    date: g.date, name: g.name, type: g.type, payout: payoutOf(g),
    quizTimer: g.quizTimer || null,
    countdownSec: g.countdownSec == null ? null : g.countdownSec,
    status: g.status, createdAt: g.createdAt || Date.now(),
    finishedAt: g.finishedAt || null,
    roster: (g.results || []).map(r => r.kidId)
  };
  if (g.status !== 'live') d.results = (g.results || []).map(cleanRow);
  return d;
}
function cleanRow(r) {
  return { kidId: r.kidId, correct: Math.max(0, Number(r.correct) || 0),
           finishSec: r.finishSec == null ? null : Number(r.finishSec),
           dnf: !!r.dnf, place: r.place || null,
           stars: Math.max(0, Math.round(Number(r.stars)) || 0) };
}
function docToGame(id, d, prev) {
  const g = {
    id: id, date: d.date || today(), name: d.name || 'Game',
    type: d.type === 'race' ? 'race' : 'quiz',
    payout: { ...DEFAULT_PAYOUT, ...(d.payout || {}) },
    quizTimer: d.quizTimer || null,
    countdownSec: d.countdownSec == null ? null : d.countdownSec,
    status: d.status || 'done', createdAt: d.createdAt || 0,
    finishedAt: d.finishedAt || null,
    raceStart: null, raceAccum: 0, qNo: d.qNo || 1, passed: 0,
    clockSeq: d.clockSeq || 0, results: []
  };
  if (g.status === 'live') {
    const cor = d.correct || {}, fin = d.finishSec || {}, dnf = d.dnf || {};
    g.passed = Object.keys(d.passedQs || {}).length;
    g.raceAccum = d.raceAccum || 0;
    g.results = (d.roster || []).map(kid => ({
      kidId: kid, correct: Math.max(0, Number(cor[kid]) || 0),
      finishSec: fin[kid] == null ? null : Number(fin[kid]),
      dnf: !!dnf[kid], place: null, stars: 0
    }));
    /* raceStart is the sending device's Date.now(), which means nothing here if
       the two clocks disagree — and on a fifteen-second question, two seconds of
       drift is enough for this screen to buzz while the other still takes taps.
       sentAt says when it was sent, so the pair can be re-expressed as "this
       long ago" in local terms. clockSeq makes that happen exactly once per
       change: re-basing on every redelivery would walk the clock backwards. It
       also settles pause against resume, where the older write simply loses. */
    if (prev && prev.clockSeq === g.clockSeq) {
      g.raceStart = prev.raceStart;
      g.raceAccum = prev.raceAccum;
    } else if (d.raceStart && d.sentAt) {
      g.raceStart = Date.now() - Math.max(0, d.sentAt - d.raceStart);
    }
  } else {
    g.results = Array.isArray(d.results) ? d.results.map(cleanRow) : [];
  }
  return g;
}

/* ------------------------------------------------------------- the engine */
sync = {
  on: false, ready: false, status: 'off',      // off | connecting | synced | error
  user: null, U: null, F: null, fdb: null, auth: null,
  unsub: [], timer: null, dirty: false, blurHooked: false,
  celebrated: null, warnedTwo: null, warnedSchema: false,
  shadow: { kids: {}, games: {}, settings: null },
  snap: { kids: null, games: null, fam: null },

  async boot() {
    if (!FIREBASE_CONFIG) return;
    this.setStatus('connecting');
    let A, U, S;
    try {
      /* This app is one classic script full of globals; the Firebase SDK is
         ESM. A dynamic import bridges the two, and the catch gives the whole
         fail-soft story for free: blocked, offline, or opened as a file:// and
         the board simply carries on by itself, exactly as it always has. */
      const B = 'https://www.gstatic.com/firebasejs/12.19.0/';
      [A, U, S] = await Promise.all([
        import(B + 'firebase-app.js'),
        import(B + 'firebase-auth.js'),
        import(B + 'firebase-firestore.js')
      ]);
    } catch (e) {
      console.warn('KidsRank: Firebase did not load — this device stays on its own.', e);
      this.setStatus('off');
      return;
    }
    try {
      const app = A.initializeApp(FIREBASE_CONFIG);
      this.U = U; this.F = S;
      this.auth = U.getAuth(app);
      try {
        /* Offline reads and queued writes. Multi-tab, because the television in
           one tab and a second tab of the same page would otherwise fight over
           the cache. Some private windows have no IndexedDB, hence the fall
           back to memory rather than failing to start at all. */
        this.fdb = S.initializeFirestore(app, {
          localCache: S.persistentLocalCache({ tabManager: S.persistentMultipleTabManager() })
        });
      } catch (e) {
        console.warn('KidsRank: no offline cache here, using memory only.', e);
        this.fdb = S.getFirestore(app);
      }
      this.ready = true;
      /* If this page was opened from a sign-in link, finish it before the auth
         listener goes on, so the board arrives already signed in rather than
         flashing "join the family board" at someone who has just done so. */
      await this.emailLinkReturn();
      U.onAuthStateChanged(this.auth, u => this.onUser(u));
    } catch (e) {
      console.warn('KidsRank: Firebase would not start.', e);
      this.setStatus('off');
    }
  },

  async signIn() {
    if (!this.ready) { toast('The shared board is not switched on in this copy yet.', 'bad'); return; }
    const p = () => new this.U.GoogleAuthProvider();
    try {
      await this.U.signInWithPopup(this.auth, p());
    } catch (e) {
      const c = e.code || '';
      // a blocked popup is normal on phones; a full-page redirect always works
      if (/popup|unsupported|cancelled/i.test(c)) {
        try { await this.U.signInWithRedirect(this.auth, p()); return; } catch (e2) {}
      }
      console.warn('KidsRank: sign-in failed', e);
      toast('Could not sign in. ' + c, 'bad');
    }
  },
  /* ---------------------------------------------------- signing in by email */
  /* Firebase counts a completed email link as a verified address, on the same
     footing as Google, so firestore.rules needs nothing added: the allowlist
     already asks for email_verified and for the address itself. */
  async emailLinkSend(email) {
    if (!this.ready) { toast('The shared board is not switched on in this copy yet.', 'bad'); return; }
    email = String(email || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('That does not look like an email address.', 'bad'); return; }
    try {
      await this.U.sendSignInLinkToEmail(this.auth, email, {
        // straight back to this same page, which then completes the sign-in
        url: location.origin + location.pathname,
        handleCodeInApp: true
      });
      /* Kept because finishing the link needs the address again, and Firebase
         deliberately does not carry it inside the link. */
      try { localStorage.setItem(LINK_KEY, email); } catch (e) {}
      ui.link = { mail: '', open: false, sent: email };
      render();
    } catch (e) {
      const c = e.code || '';
      toast(c === 'auth/operation-not-allowed'
              ? 'Email links are not switched on for this board yet.'
          : c === 'auth/invalid-email'
              ? 'That does not look like an email address.'
          : /continue-uri|unauthorized-domain/.test(c)
              ? 'This address of the board is not authorised to send sign-in links.'
          : 'Could not send the link. ' + c, 'bad');
      console.warn('KidsRank: could not send a sign-in link', e);
    }
  },
  /* This page was opened from a link. */
  async emailLinkReturn() {
    let isLink = false;
    try { isLink = this.U.isSignInWithEmailLink(this.auth, location.href); } catch (e) {}
    if (!isLink) return;
    await this.emailLinkFinish(location.href);
    // the code is spent either way, and leaving it in the address bar means a
    // refresh retries a dead code and looks like a broken sign-in
    this.cleanLinkUrl();
  },
  /* A link pasted in by hand, which is the only way into an app added to an
     iPhone's home screen: that app has its own storage and its own sign-in, and
     a link tapped in Mail opens in Safari and signs Safari in instead. Nothing
     about the sign-in changes — the code inside the link is the same code. */
  async emailLinkPaste(url) {
    if (!this.ready) { toast('The shared board is not switched on in this copy yet.', 'bad'); return; }
    url = String(url || '').trim();
    if (!url) { toast('Paste the sign-in link from the email first.', 'bad'); return; }
    let isLink = false;
    try { isLink = this.U.isSignInWithEmailLink(this.auth, url); } catch (e) {}
    if (!isLink) {
      toast('That is not a sign-in link. Copy the whole link out of the email.', 'bad');
      return;
    }
    if (await this.emailLinkFinish(url)) return;   // signed in; the board redraws itself
    ui.link.paste = '';
    render();
  },
  /* Shared by both roads in. Returns true if it signed in. */
  async emailLinkFinish(href) {
    let email = '';
    try { email = localStorage.getItem(LINK_KEY) || ''; } catch (e) {}
    /* Opened somewhere other than the browser that asked — a phone tapping a
       link out of a laptop's inbox. The address has to be given again; that is
       Firebase refusing to let a forwarded link sign anybody in by itself. */
    if (!email) email = String(prompt('Which email address was this link sent to?') || '').trim();
    if (!email) { toast('Signing in needs the address the link was sent to.', 'bad'); return false; }
    try {
      await this.U.signInWithEmailLink(this.auth, email, href);
      try { localStorage.removeItem(LINK_KEY); } catch (e) {}
      ui.link = { mail: '', paste: '', open: false, sent: '' };
      toast('Signed in as ' + email);
      return true;
    } catch (e) {
      const c = e.code || '';
      toast(c === 'auth/invalid-email'
              ? 'That is not the address this link was sent to.'
          : /expired-action-code|invalid-action-code/.test(c)
              ? 'That link has been used already, or has expired. Ask for a fresh one.'
          : 'Could not finish signing in. ' + c, 'bad');
      console.warn('KidsRank: email link sign-in failed', e);
      return false;
    }
  },
  cleanLinkUrl() {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  },

  async signOut() {
    this.detach();
    this.setStatus('off');
    try { if (this.auth) await this.U.signOut(this.auth); } catch (e) {}
  },
  onUser(u) {
    this.user = u || null;
    if (!u) { this.detach(); this.setStatus('off'); this.repaint(); return; }
    this.attach();
  },

  attach() {
    this.detach();
    this.setStatus('connecting');
    const F = this.F, fdb = this.fdb;
    const onErr = e => {
      if ((e.code || '') === 'permission-denied') {
        toast('That account is not on the family board.', 'bad');
        this.signOut();
      } else {
        console.warn('KidsRank: listener error', e);
        this.setStatus('error');
      }
    };
    this.unsub.push(F.onSnapshot(F.doc(fdb, 'families', FAMILY_ID),
      s => { this.snap.fam = s; this.apply('fam'); }, onErr));
    this.unsub.push(F.onSnapshot(F.collection(fdb, 'families', FAMILY_ID, 'kids'),
      s => { this.snap.kids = s; this.apply('kids'); }, onErr));
    this.unsub.push(F.onSnapshot(F.collection(fdb, 'families', FAMILY_ID, 'games'),
      s => { this.snap.games = s; this.apply('games'); }, onErr));
  },
  detach() {
    this.unsub.forEach(u => { try { u(); } catch (e) {} });
    this.unsub = [];
    this.on = false;
    clearTimeout(this.timer);
    this.snap = { kids: null, games: null, fam: null };
    this.shadow = { kids: {}, games: {}, settings: null };
  },

  /* ---------------------------------------------------------------- coming in */
  apply(src) {
    if (!this.snap.kids || !this.snap.games) return;      // wait for both
    if (!this.on) this.firstJoin(); else this.absorb(src);
  },

  /* The first snapshot decides how this device joins. Nothing is destroyed on
     the way in: the local board is copied to a timestamped backup key before
     anything is adopted or replaced. */
  firstJoin() {
    const remoteEmpty = this.snap.kids.empty && this.snap.games.empty;
    const localHas = db.kids.length > 0 || db.games.length > 0;
    let joined = false;
    try { joined = localStorage.getItem(ADOPTED_KEY) === '1'; } catch (e) {}

    if (remoteEmpty && localHas) {
      this.backup(); this.markJoined();
      this.on = true;
      this.rebuildShadow();          // empty, so this sends the lot up
      this.setStatus('synced');
      /* Not the debounce. A snapshot arriving in that window would run absorb()
         and replace this board with the empty remote one before it ever left. */
      this.pushNow();
      toast('This board is now the family board.');
      this.repaint();
      return;
    }

    if (!remoteEmpty && localHas && !joined) {
      const useFamily = confirm(
        'The family board already has ' + plural(this.snap.kids.size, 'player') +
        ' and ' + plural(this.snap.games.size, 'game') + '.\n\n' +
        'OK — use the family board. This device\u2019s own ' + plural(db.kids.length, 'player') +
        ' and ' + plural(db.games.length, 'game') + ' are kept in a backup, off the board.\n\n' +
        'Cancel — put THIS device\u2019s board up as the family board instead.');
      this.backup(); this.markJoined();
      if (!useFamily) {
        if (!confirm('Replace the family board with this device\u2019s board? The ' +
                     plural(this.snap.games.size, 'game') + ' already up there will come off, for everybody.')) {
          this.setStatus('off');      // signed in but not joined; nothing written
          return;
        }
        this.on = true;
        this.rebuildShadow();         // shadow is what is up there now...
        this.setStatus('synced');
        this.pushNow();               // ...so this replaces it with this board
        toast('The family board now matches this device.');
        this.repaint();
        return;
      }
    }

    this.backup(); this.markJoined();
    this.on = true;
    this.absorb();
    // nobody has written the family settings yet, so this device seeds them
    if (!this.snap.fam || !this.snap.fam.exists()) this.flush();
  },

  absorb(src) {
    const wasLive = liveGame();
    const prevById = {};
    db.games.forEach(g => { prevById[g.id] = g; });

    const kids = [], games = [];
    this.snap.kids.forEach(d => kids.push(docToKid(d.id, d.data())));
    this.snap.games.forEach(d => games.push(docToGame(d.id, d.data(), prevById[d.id])));
    kids.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    games.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    db.kids = kids;
    db.games = games;

    if (this.snap.fam && this.snap.fam.exists()) {
      const f = this.snap.fam.data();
      // settings bind straight to db, so a remote value must not land mid-typing
      const a = document.activeElement;
      const typing = a && a.matches && a.matches('[data-bind^="settings"]');
      if (!typing) {
        if (f.boardTitle) db.settings.boardTitle = f.boardTitle;
        if (f.defaultPayout) db.settings.defaultPayout = { ...DEFAULT_PAYOUT, ...f.defaultPayout };
      }
      if ((f.schema || 1) > SCHEMA && !this.warnedSchema) {
        this.warnedSchema = true;
        toast('This device is running an older version — reload the page.', 'bad');
      }
    }

    this.rebuildShadow(src);
    writeLocal();
    this.setStatus('synced');
    this.afterAbsorb(wasLive);
  },

  afterAbsorb(wasLive) {
    /* The other board pressed Finish. Without this, the television just drops
       back to "no game is running" at the exact moment of the payoff. */
    if (wasLive) {
      const g = db.games.find(x => x.id === wasLive.id);
      if (g && g.status === 'done' && this.celebrated !== g.id &&
          ui.screen !== 'results' && !ui.results) {
        this.celebrated = g.id;
        ui.celebrate = g.id; ui.screen = 'board'; ui.countUp = true;
        this.repaint(true);
        const champs = winnersOf(g);
        confetti(champs.length ? champs.map(k => k.color).concat(['#fde047', '#ffffff']) : COLORS);
        fanfare();
        return;
      }
    }
    // a game started elsewhere: follow it in, but never yank anyone out of a form
    const now = liveGame();
    if (now && (!wasLive || wasLive.id !== now.id) && ui.screen === 'board' &&
        !ui.setup && !ui.kidEdit && !ui.profile && !ui.settingsOpen && !ui.celebrate) {
      ui.screen = 'live'; ui.countUp = false;
    }
    /* Two games at once. liveGame() picks the same one on both boards, so the
       scoring still agrees, but somebody has to be told the other exists. */
    const many = liveGames();
    if (many.length > 1) {
      const sig = many.map(g => g.id).join(',');
      if (this.warnedTwo !== sig) {
        this.warnedTwo = sig;
        toast('Two games are running. Abort the one you do not want.', 'bad');
      }
    }
    this.repaint();
  },

  /* A remote change repaints the whole page, which steals focus, closes a phone
     keyboard, and — since a half-cleared number box binds as 0 — can pin a star
     field to zero mid-edit. So it waits for the caret to leave. Neither live
     screen has a bound input, so scoring is never held up by this. */
  repaint(force) {
    if (!document.getElementById('app')) return;
    const a = document.activeElement;
    if (!force && a && a.matches && a.matches('[data-bind]')) {
      this.dirty = true;
      this.hookBlur();
      return;
    }
    this.dirty = false;
    render();
  },
  hookBlur() {
    if (this.blurHooked) return;
    this.blurHooked = true;
    document.addEventListener('focusout', () => setTimeout(() => {
      const a = document.activeElement;
      if (this.dirty && !(a && a.matches && a.matches('[data-bind]'))) {
        this.dirty = false;
        render();
      }
    }, 0));
  },

  /* ---------------------------------------------------------------- going out */
  settingsDoc() {
    return { boardTitle: db.settings.boardTitle || 'Family Game Board',
             defaultPayout: { ...DEFAULT_PAYOUT, ...(db.settings.defaultPayout || {}) } };
  },
  /* What we believe is up there, so a flush sends only what actually changed.
     Only the collection that moved is re-hashed: a score tap is a games
     snapshot, and re-hashing every child's photograph on each tap of a quiz
     would make an old television feel slow for no reason at all. */
  rebuildShadow(src) {
    if (!src || src === 'kids') {
      const sk = {};
      this.snap.kids.forEach(d => { sk[d.id] = JSON.stringify(kidToDoc(docToKid(d.id, d.data()))); });
      this.shadow.kids = sk;
    }
    if (!src || src === 'games') {
      const sg = {};
      this.snap.games.forEach(d => { sg[d.id] = JSON.stringify(gameToDoc(docToGame(d.id, d.data()))); });
      this.shadow.games = sg;
    }
    if (!src || src === 'fam') {
      let ss = null;
      if (this.snap.fam && this.snap.fam.exists()) {
        const f = this.snap.fam.data();
        ss = JSON.stringify({ boardTitle: f.boardTitle || 'Family Game Board',
                              defaultPayout: { ...DEFAULT_PAYOUT, ...(f.defaultPayout || {}) } });
      }
      this.shadow.settings = ss;
    }
  },

  // debounced, so typing a board title is one write and not twenty
  flush() {
    if (!this.on) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 400);
  },
  pushNow() { clearTimeout(this.timer); this.push(); },

  push() {
    if (!this.on) return;
    const F = this.F, fdb = this.fdb;
    const kidRef  = id => F.doc(fdb, 'families', FAMILY_ID, 'kids', id);
    const gameRef = id => F.doc(fdb, 'families', FAMILY_ID, 'games', id);
    const fail = e => this.failed(e);
    try {
      const sdoc = this.settingsDoc(), sj = JSON.stringify(sdoc);
      if (sj !== this.shadow.settings) {
        this.shadow.settings = sj;
        F.setDoc(F.doc(fdb, 'families', FAMILY_ID), { ...sdoc, schema: SCHEMA }, { merge: true }).catch(fail);
      }
      const seenK = {};
      db.kids.forEach(k => {
        const doc = kidToDoc(k), j = JSON.stringify(doc);
        seenK[k.id] = 1;
        if (this.shadow.kids[k.id] !== j) {
          this.shadow.kids[k.id] = j;
          F.setDoc(kidRef(k.id), doc, { merge: true }).catch(fail);
        }
      });
      Object.keys(this.shadow.kids).forEach(id => {
        if (!seenK[id]) { delete this.shadow.kids[id]; F.deleteDoc(kidRef(id)).catch(fail); }
      });
      const seenG = {};
      db.games.forEach(g => {
        const doc = gameToDoc(g), j = JSON.stringify(doc);
        seenG[g.id] = 1;
        if (this.shadow.games[g.id] !== j) {
          this.shadow.games[g.id] = j;
          F.setDoc(gameRef(g.id), doc, { merge: true }).catch(fail);
        }
      });
      Object.keys(this.shadow.games).forEach(id => {
        if (!seenG[id]) { delete this.shadow.games[id]; F.deleteDoc(gameRef(id)).catch(fail); }
      });
    } catch (e) { this.failed(e); }
  },

  /* Writes are fired and forgotten. Offline, the promise does not settle until a
     server acknowledges it, so waiting on one would freeze the tap. A rejection
     must still never pass in silence, or an evening of scoring quietly evaporates. */
  failed(e) {
    console.warn('KidsRank: a write was rejected', e);
    // forget what we thought was up there, so the next change re-sends everything
    this.shadow = { kids: {}, games: {}, settings: null };
    this.setStatus('error');
    toast('Could not reach the family board. Nothing is lost — this device still has it all.', 'bad');
  },

  /* --------------------------------------------------- the live game's own
     These fields belong to these operations and to nothing else. Firestore
     keeps a document's writes in the order they were made, so the setDoc that
     creates a game always lands before any tap that follows it. */
  op(gameId, pairs) {
    if (!this.on || !pairs.length) return;
    const F = this.F;
    const args = [F.doc(this.fdb, 'families', FAMILY_ID, 'games', gameId)];
    pairs.forEach(p => {
      // a FieldPath rather than a dotted string, so a player id can hold anything
      args.push(Array.isArray(p[0]) ? new F.FieldPath(...p[0]) : p[0]);
      args.push(p[1]);
    });
    F.updateDoc.apply(null, args).catch(e => this.failed(e));
  },
  bump(gameId, kidId, delta, clockPairs) {
    let p = [[['correct', kidId], this.F.increment(delta)]];
    if (clockPairs && clockPairs.length) {
      const g = db.games.find(x => x.id === gameId) || {};
      p = p.concat(clockPairs, [['clockSeq', (g.clockSeq || 0) + 1], ['sentAt', Date.now()]]);
    }
    this.op(gameId, p);
  },
  setFinish(gameId, kidId, sec) {
    this.op(gameId, [[['finishSec', kidId], sec], [['dnf', kidId], false]]);
  },
  clearFinish(gameId, kidId) {
    this.op(gameId, [[['finishSec', kidId], null], [['dnf', kidId], false]]);
  },
  // keyed by question number, so a second board writing the same one is a no-op
  markPassed(gameId, qNo) {
    this.op(gameId, [[['passedQs', String(qNo)], true]]);
  },
  clock(gameId, pairs, seq) {
    this.op(gameId, pairs.concat([['clockSeq', (seq || 0) + 1], ['sentAt', Date.now()]]));
  },
  // once the stars are awarded the live tallies are noise, and a late tap would
  // only make the game contradict itself
  finalize(gameId) {
    const D = this.F.deleteField;
    this.op(gameId, [['correct', D()], ['finishSec', D()], ['dnf', D()],
                     ['passedQs', D()], ['raceStart', null]]);
  },

  /* ---------------------------------------------------------------- utilities */
  backup() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) localStorage.setItem(KEY + '.backup.' + Date.now(), raw);
    } catch (e) { console.warn('KidsRank: could not write a backup', e); }
  },
  markJoined() { try { localStorage.setItem(ADOPTED_KEY, '1'); } catch (e) {} },
  setStatus(s) {
    if (this.status === s) return;
    this.status = s;
    this.repaint();
  }
};


/* ================================================================== INIT */
render();
sync.boot();
/* First run lands straight in the add-player form — unless there is a family
   board to join, in which case the players are most likely already on it and
   the thing to do is sign in, not type them all in again. */
if (!db.kids.length && !FIREBASE_CONFIG) actions['kid-new']();
</script>
</body>
</html>
